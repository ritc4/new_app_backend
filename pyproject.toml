[project]
name = "new-app-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "packaging>=26.0",
    "passlib>=1.7.4",
    "phonenumbers>=9.0.30",
    "pycountry>=26.2.16",
    "pydantic-extra-types>=2.11.2",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.26",
    "python-slugify>=8.0.4",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "user-agents>=2.2.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "faker>=40.13.0",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "responses>=0.26.0",
    "ruff>=0.15.10",
    "types-aiobotocore-s3>=3.7.0",
    "types-passlib>=1.7.7.20260211",
    "types-python-slugify>=8.0.2.20240310",
    "types-redis>=4.6.0.20241004",
    "types-requests>=2.33.0.20260503",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


# настройки Ruff для удаления неиспользуемых импортов
[tool.ruff]
# Общие настройки
# Ограничение длины строки (золотой стандарт Python)
line-length = 120

[tool.ruff.lint]
# Группируем ВСЕ настройки линтера в одной секции
select = [
    "E", "F", "I", "N", "B", "UP", "S", 
    "ANN", "PT", "RET", "ARG", "COM", "T20"
]
ignore = ["COM812"] 
fixable = ["ALL"]

[tool.ruff.format]
# Настройки форматирования
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_configs = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_expr = false
disallow_any_decorated = true
warn_return_any = true
no_implicit_optional = true
warn_unused_ignores = true
check_untyped_defs = true
local_partial_types = true
exclude = [
    "app/migrations/",
]

# Плагины для корректной работы с FastAPI/Pydantic и SQLAlchemy
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "aioboto3.*",
    "user_agents.*",
    "jose.*",
    "botocore.*",
]
ignore_missing_imports = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Послабления для тестов
module = "app.tests.*"
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
# Глушим специфические ошибки тестов (Any, атриубты, аргументы типов)
disable_error_code = ["misc", "type-arg", "assignment", "attr-defined", "operator", "arg-type"]

[[tool.mypy.overrides]]
# Исключение конкретно для ошибки Any в настройках
module = "app.config.settings"
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Исключение для воркеров Celery, так как их декораторы ломают типизацию
module = "app.workers.*"
disallow_untyped_decorators = false
# Если ошибка [misc] не уйдет, добавь эту строку:
disable_error_code = ["misc"]

[tool.ruff.lint.per-file-ignores]
# В тестах разрешаем assert (S101) и отсутствие аннотаций в аргументах (ANN)
"app/tests/*" = ["S101", "ANN", "S311", "ARG001", "T201", "S105", "S106"]
"app/scripts/*" = ["T201"]
"app/migrations/*" = ["ANN", "E501"] 

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
