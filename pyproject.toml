[project]
name = "new-app-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "packaging>=26.0",
    "passlib>=1.7.4",
    "pydantic-extra-types>=2.11.2",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.26",
    "python-slugify>=8.0.4",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "user-agents>=2.2.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "faker>=40.13.0",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "responses>=0.26.0",
    "ruff>=0.15.10",
    "types-passlib>=1.7.7.20260211",
    "types-python-slugify>=8.0.2.20240310",
    "types-redis>=4.6.0.20241004",
    "types-requests>=2.33.0.20260503",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


# настройки Ruff для удаления неиспользуемых импортов
[tool.ruff]
# Общие настройки
# Ограничение длины строки (золотой стандарт Python)
line-length = 120

[tool.ruff.lint]
# Группируем ВСЕ настройки линтера в одной секции
select = ["E", "F", "I", "N", "B", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
# Настройки форматирования
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
strict = true  # Включает почти все строгие проверки
ignore_missing_imports = true
warn_unused_configs = true
exclude = [
    "app/migrations/",
    "app/tests/"
]

# Плагины для корректной работы с FastAPI/Pydantic и SQLAlchemy
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

[[tool.mypy.overrides]]
# Отключаем строгую проверку для библиотек без типов, если возникнут проблемы
module = [
    "aioboto3.*",
    "user_agents.*",
    "jose.*",
    "passlib.*"
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
